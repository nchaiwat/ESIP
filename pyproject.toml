[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "esip"
version = "0.1.0"
description = "Enterprise Sales Intelligence Platform data integration workspace"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2,<4",
  "openpyxl>=3.1,<4",
  "pyyaml>=6,<7",
  "pydantic>=2.7,<3",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.5,<1", "mypy>=1.10,<2"]
legacy_excel = ["xlrd>=2.0,<3"]
parquet = ["pyarrow>=16,<20"]

[project.scripts]
esip = "esip.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
